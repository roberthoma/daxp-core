# Root logger level (Global setting)
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT

# Define the Console Appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5p %c{1.} - %m%n

# SPECIFIC CONFIGURATION FOR YOUR CLASS
# This targets your exact package
logger.dax.name = org.daxprotocol.core.dictionary.populator
logger.dax.level = debug
logger.dax.additivity = false
logger.dax.appenderRef.stdout.ref = STDOUT