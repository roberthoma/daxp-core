plugins {
    id 'java'
}

group = 'org.daxprotocol'
version = '0.5.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'

    testImplementation 'org.apache.logging.log4j:log4j-core:2.24.1'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.1'

}

test {
    // This ensures Gradle shows test output/logs in the terminal
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

test {
    useJUnitPlatform()
}